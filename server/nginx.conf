user root;
worker_processes auto;
pcre_jit on;
daemon off;

env REDIS_PASSWORD;

error_log /dev/stdout warn;

events {
        multi_accept on;
        worker_connections 8192;
}

http {
        sendfile on;
        include mime.types;
        default_type application/octet-stream;
        resolver 127.0.0.11 valid=30s;

        map $http_upgrade $connection_upgrade {
                default upgrade;
                '' close;
        }

        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 60;
        types_hash_max_size 2048;
        client_max_body_size 1024M;

        server_tokens off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;

        access_log /dev/stdout;

        upstream servers {
                server 127.0.0.1:8800;
                server 127.0.0.1:8801;
                server 127.0.0.1:8802;
                server 127.0.0.1:8803;
        }

        # charset utf-8;
        server {
                include listen.conf;

        error_page 497 = @handle_http_fallback;
        set $real_proto $scheme;

        location ~ ^/d/(?<id>[0-9a-z]+)/ {
        set $target_loc "";
        set $target_tok "";
        set $target_url "";
        set $target_uri "";
        set $target_uid "";

        rewrite_by_lua_file ngx_op_api_gateway_validate.luac;

        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header X-ClientId $target_uid;

        proxy_set_header Cookie "";
        proxy_set_header User-Agent "";
        add_header Set-Cookie "";

        proxy_set_header Origin $target_url;
        proxy_set_header X-Token $target_tok;
        proxy_set_header Host $target_loc;

        proxy_pass $target_url$target_uri$is_args$args;

        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;

        # [pigeon-fork] 禁用上游压缩，便于向 HTML 注入脚本
        proxy_set_header Accept-Encoding "";

        # [pigeon-fork] 向 /d/ 代理的 lamda WebUI HTML 注入「AI 设置浏览器端持久化」脚本。
        # 策略：缓存响应直至找到首个 </head>（单分支渲染，仅一处），注入后原样流出；
        #      非 text/html 响应不受影响；超过 256KB 仍未命中则放弃注入直接放行。
        body_filter_by_lua_block {
          if ngx.ctx.pigeon_inject_done then return end
          local ct = ngx.header["Content-Type"] or ""
          if type(ct) == "table" then ct = ct[1] or "" end
          if not string.find(ct, "text/html", 1, true) then
            ngx.ctx.pigeon_inject_done = true
            return
          end
          local buf = (ngx.ctx.pigeon_inject_buf or "") .. (ngx.arg[1] or "")
          ngx.arg[1] = ""
          local s = string.find(buf, "</head>", 1, true)
          if s then
            ngx.arg[1] = string.sub(buf, 1, s + 6)
              .. "<script src=\"/__pigeon/ai-persist.js\"></script>"
              .. string.sub(buf, s + 7)
            ngx.ctx.pigeon_inject_buf = nil
            ngx.ctx.pigeon_inject_done = true
          elseif ngx.arg[2] or #buf > 262144 then
            ngx.arg[1] = buf
            ngx.ctx.pigeon_inject_buf = nil
            ngx.ctx.pigeon_inject_done = true
          else
            ngx.ctx.pigeon_inject_buf = buf
          end
        }
        }

        location ~ ^/api/|^/s$ {
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $real_proto;

        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;

        proxy_pass http://servers;

        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
        }

        location @handle_http_fallback {
        if ($uri !~ ^/properties) {
                return 444;
        }
        set $real_proto "http";
        proxy_pass http://127.0.0.1:8123;
        }

        # [pigeon-fork] 非 SSL 监听（TLS_DISABLED=true）时，设备引导接口 /properties 的直通路由
        location ~ ^/properties {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_pass http://127.0.0.1:8123;
        }

        # [pigeon-fork] /d/ 远程页注入用静态脚本（AI 设置浏览器端持久化）
        location = /__pigeon/ai-persist.js {
        root /var/www/html;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        }

        location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /404/index.html;
        }
        }
}

stream {
        resolver 127.0.0.11 valid=30s;

        server {
                include listen-control.conf;
        ssl_preread on;
        set $target_loc "";

        preread_by_lua_file ngx_op_webui_validate.luac;

        #proxy_buffer_size 0;
        proxy_next_upstream off;
        proxy_socket_keepalive on;
        proxy_connect_timeout 30s;
        proxy_pass $target_loc;
        }
}
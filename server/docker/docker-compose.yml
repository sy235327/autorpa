version: "3"

networks:
    pigeon-net:
        driver: bridge
        ipam:
            config:
                - subnet: 172.35.0.0/24
    # [pigeon-fork] lan-ipvlan 已移除：Docker Desktop(Windows)/多数本机环境不支持 ipvlan。
    # 如需为容器分配独立局域网 IP（Linux 宿主机高级玩法），
    # 请参照上游 docker-compose.yml 恢复本网络段与 pigeon 服务的 lan-ipvlan 挂载。

services:
    pigeon:
        # [pigeon-fork] 本地构建镜像
        image: pigeon-fork:1.0
        build:
            context: ..
            dockerfile: Dockerfile
        container_name: pigeon
        depends_on:
            - postgres
            - rabbitmq
            - redis-master
            - redis-slave01
            - redis-slave02
            - redis-lock01
            - redis-lock02
            - redis-lock03
        environment:
            - DOMAIN=${DOMAIN}
            - API_PORT=${API_PORT}
            - WEB_PORT=${WEB_PORT}
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - LOCAL_LAN_IP=${LOCAL_LAN_IP}
            - PUBLIC_IP=${PUBLIC_IP}
            - TOP_CLIENT_KEY=${TOP_CLIENT_KEY}
            - TOP_ENDPOINT=${TOP_ENDPOINT}
            - TOP_SECRET=${TOP_SECRET}
            # [pigeon-fork] 测试环境默认 Web 纯 HTTP；生产置 TLS_DISABLED=false 并用 /user 内证书启用 HTTPS
            - TLS_DISABLED=${TLS_DISABLED:-true}
            # [pigeon-fork] direct 模式设备网关主机覆盖（模拟器/NAT 场景，如 host.docker.internal；留空=上游默认）
            - DIRECT_GATEWAY_HOST=${DIRECT_GATEWAY_HOST:-}
            # [pigeon-fork] direct 设备 API 端口固定（调试用；留空=上游随机 20000-60000）
            - DIRECT_API_PORT=${DIRECT_API_PORT:-}
        privileged: true
        cap_add:
            - NET_ADMIN
        ports:
            - ${API_PORT}:${API_PORT}
            - ${WEB_PORT}:${WEB_PORT}
            - ${FWD_PORT}:${FWD_PORT}
            - 8883:8883
        networks:
            pigeon-net: {}
        volumes:
            - ./data/user:/user

    postgres:
        image: postgres:18
        container_name: postgres
        shm_size: 256MB
        networks:
            - pigeon-net
        environment:
            - PGDATA=/var/lib/postgresql/data
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=postgres
            - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
            - POSTGRES_DB=pigeon
        volumes:
            - ./postgres.conf:/etc/postgresql/postgresql.conf
            - ./data/postgres:/var/lib/postgresql/data
        command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres"]
            interval: 10s
            timeout: 5s

    rabbitmq:
        image: rabbitmq:3
        container_name: rabbitmq
        networks:
            - pigeon-net
        environment:
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
            - RABBITMQ_DEFAULT_USER=rabbit
        volumes:
            -  ./data/rabbitmq:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
            interval: 10s
            timeout: 5s

    redis-master:
        image: redis:8
        container_name: redis-master
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-master.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-slave01:
        image: redis:8
        container_name: redis-slave01
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-slave.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-slave02:
        image: redis:8
        container_name: redis-slave02
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-slave.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-lock01:
        image: redis:8
        container_name: redis-lock01
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-lock.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-lock02:
        image: redis:8
        container_name: redis-lock02
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-lock.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s

    redis-lock03:
        image: redis:8
        container_name: redis-lock03
        command: sh /usr/bin/redis-server.sh
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - pigeon-net
        volumes:
            - ./redis/server-lock.sh:/usr/bin/redis-server.sh
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s